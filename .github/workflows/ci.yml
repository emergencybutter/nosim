name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      real_data:
        description: Also run the real-data cross-checks (GLO-30, BBBike New York)
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * *" # nightly real-data run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Gate (format, clippy, docs, tests, drift, CLI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: tools/ci.sh check
        run: tools/ci.sh check

  real-data:
    name: Real-data cross-checks (libtiff, libosmium, networkx)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.real_data)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python reference implementations
        run: pip install osmium pyarrow networkx pillow
      - name: Week number for the download cache
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/real-data
          key: real-data-${{ steps.week.outputs.key }}
      - name: tools/ci.sh real-data
        run: tools/ci.sh real-data ~/real-data
