language = "C"
cpp_compat = true
include_guard = "NOSIM_H"
include_version = true
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
header = """/* nosim C ABI. Generated by cbindgen from ffi/src; do not edit.
 *
 * Every function is thread-safe. Handles (Nosim*Handle) are created by a *_new / *_load
 * function and released by the matching *_free; passing NULL is always safe and returns an
 * error status or a zero value. On NOSIM_STATUS_* != OK, nosim_last_error() returns a
 * message valid until the next failing call on the same thread.
 */"""

[export]
prefix = ""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
sort_by = "None"
